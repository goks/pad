<!DOCTYPE html>

    <!-- CSS  -->

<body>
    <nav class="teal darken-1" role="navigation">

    <div class="section">

        <div class="spinner-layer spinner-red">
            <div class="circle-clipper left">

            <div class="circle-clipper right">

        </div>

        <div class="spinner-layer spinner-yellow">
            <div class="circle-clipper left">
                <div class="circle"></div>
            </div>

            <div class="circle-clipper right">

    <footer class="page-footer teal darken-2">
        <div class="container">
            <div class="row">
                <div class="col s12">
                    <h5 class="white-text">About</h5>
                    <p class="grey-text text-lighten-4">The much-needed text-sharing platform.</p>
                    <p class="grey-text text-lighten-4" id="padStatus"></p>
                </div>
            </div>
        </div>
        <div class="footer-copyright">
            <div class="container">
                <span class="orange-text text-lighten-3">©</span> All rights reserved.
            </div>
        </div>
    </footer>


    <!--  Scripts-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var toolbarOptions = [
            [{
                'font': []
            }],
            ['bold', 'italic', 'underline', 'strike'], // toggled buttons
            ['blockquote', 'code-block'],

            // [{ 'header': 1 }, { 'header': 2 }],               // custom button values
            [{
                'list': 'ordered'
            }, {
                'list': 'bullet'
            }],
            [{
                'script': 'sub'
            }, {
                'script': 'super'
            }], // superscript/subscript
            [{
                'indent': '-1'
            }, {
                'indent': '+1'
            }], // outdent/indent
            [{
                'direction': 'rtl'
            }], // text direction

            [{
                'size': ['small', false, 'large', 'huge']
            }], // custom dropdown
            // [{ 'header': [1, 2, 3, 4, 5, 6, false] }],

            [{
                'color': []
            }, {
                'background': []
            }], // dropdown with defaults from theme
            [{
                'align': []
            }],
            ['link', 'image', 'video', 'formula'],
            // ['clean']                                         // remove formatting button
        ];
        // Rejects a picture bigger than 512 KB: the image travels as a base64
        // data URL inside the document, and a single Firebase write cannot
        // exceed 1 MB. This used to be patched into js/quill.js, where an
        // upgrade of the library would quietly drop it.
        var MAX_IMAGE_BYTES = 512 * 1024;
        function insertImage() {
            var fileInput = document.createElement('input');
            fileInput.setAttribute('type', 'file');
            fileInput.setAttribute('accept', 'image/*');
            fileInput.onchange = function () {
                var file = fileInput.files && fileInput.files[0];
                if (!file) return;
                if (file.size > MAX_IMAGE_BYTES) {
                    M.toast({ html: 'Image is larger than 512 KB' });
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () {
                    var range = quill.getSelection(true) || { index: quill.getLength() - 1 };
                    quill.insertEmbed(range.index, 'image', reader.result, 'user');
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        }
        var quill = new Quill('#textAreaContainer', {
            //debug: 'info',
            modules: {
                toolbar: {
                    container: toolbarOptions,
                    handlers: {
                        image: insertImage
                    },
                },
            },
            placeholder: 'Compose ...',
            theme: 'snow'
        });
    </script>
    <script type="text/javascript" src="js/auth.js"></script>

</body>

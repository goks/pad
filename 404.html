<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pad</title>
    <script>
        // GitHub Pages answers any path that is not a real file with this page
        // and a 404 status. Hand the name over where the app expects it - the
        // hash, which the server never sees - so the pad itself answers 200.
        var segments = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
        location.replace(segments.length > 1 ? '/pad/#' + segments[segments.length - 1] : '/pad/');
    </script>
</head>
<body>
    <p>This pad lives at <a href="/pad/">/pad/</a> now.</p>
</body>
</html>
